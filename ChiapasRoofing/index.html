<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- makes site fit properly on mobile devices or tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- browser tab icon -->
    <link rel="icon" type="image/png" href="/pictures/hammer-icon.png" />
    <!-- controls text in browser tab and search engine results (blue clickable link) -->
    <title>Chiapas Roofing | Roof Repair & Replacement in [City, State]</title>
    <!-- short grey summary of the page content that appears underneath the title -->
    <meta name="description" content="Licensed roofing contractors serving [City, State]. Free roof inspections, storm damage repair, and full roof replacements. Call [Phone Number]." />
    <!-- tells google not to split the page into multiple pages in search results -->
    <link rel="canonical" href="https://chiapasroofing.net/" />
    <!-- when someone shares the page, this is the information that will appear (says its a website) -->
    <meta property="og:type" content="website" />
    <!-- tells which webstite url to attach the information to (the page that will be shared) -->
    <meta property="og:url" content="https://chiapasroofing.net/" />
    <!-- sets bold headline for when they send this -->
    <meta property="og:title" content="Chiapas Roofing | Roof Repair & Replacement" />
    <!-- sets smaller subtitle text in the card -->
    <meta property="og:description" content="Licensed residential and commercial roofing in [City, State]. Request a free estimate today." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
